<!DOCTYPE html>
<html>
<head>
    <title>Esports Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Top 10 Tuyển Thủ KDA Cao Nhất</h1>
    <canvas id="kdaChart" width="800" height="400"></canvas>

    <script>
        fetch('http://localhost:3000/api/leaderboard')
            .then(res => res.json())
            .then(data => {
                const labels = data.map(item => item._id);
                const kdaValues = data.map(item => item.kda.toFixed(2));

                new Chart(document.getElementById('kdaChart'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Chỉ số KDA',
                            data: kdaValues,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)'
                        }]
                    }
                });
            });
    </script>
</body>
</html>
