<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }
        body {
            background-color: #0f172a; /* Màu nền tối xanh thẫm */
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #38bdf8; /* Màu xanh neon */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .chart-container {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.2);
            width: 100%;
            max-width: 900px;
        }
    </style>
</head>
<body>
    <h1>Bảng Xếp Hạng KDA Tuyển Thủ</h1>
    
    <div class="chart-container">
        <canvas id="kdaChart"></canvas>
    </div>

    <script>
        fetch('http://localhost:3000/api/leaderboard')
            .then(res => res.json())
            .then(data => {
                const labels = data.map(item => item._id);
                const kdaValues = data.map(item => parseFloat(item.kda.toFixed(2))); // Ép kiểu về số

                // Cấu hình Chart.js cho Dark Mode
                Chart.defaults.color = '#94a3b8';
                Chart.defaults.font.family = 'Rajdhani';

                new Chart(document.getElementById('kdaChart'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Chỉ số KDA',
                            data: kdaValues,
                            backgroundColor: 'rgba(56, 189, 248, 0.8)', // Xanh neon
                            borderColor: '#38bdf8',
                            borderWidth: 1,
                            borderRadius: 6, // Bo góc cột
                            hoverBackgroundColor: '#0ea5e9'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: false // Ẩn chú thích thừa
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)' // Lưới mờ
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                }
                            }
                        }
                    }
                });
            })
            .catch(error => console.error('Lỗi khi tải dữ liệu:', error));
    </script>
</body>
</html>
